<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Client Login</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-hero">
        <a class="brand" href="./" aria-label="Home">
          <span class="brand-plane"></span>
        </a>
        <div>
          <p class="dashboard-eyebrow">Client access</p>
          <h1>Sign in to view holiday quotes</h1>
          <p>Use one of the seven demo client accounts below. Each account has its own quote requests and agent quote mix.</p>
        </div>
      </section>

      <section class="login-card">
        <form id="loginForm" class="login-form" data-dashboard-path="dashboard/client/">
          <h2>Client Login</h2>
          <label class="field">
            <span>Email</span>
            <input name="email" type="email" autocomplete="email" />
          </label>
          <label class="field">
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password" />
          </label>
          <small data-login-error></small>
          <button class="submit-button" type="submit">View Dashboard</button>
        </form>

        <div class="demo-client-panel">
          <div>
            <strong>Demo clients</strong>
            <span>Password for all: 12345</span>
          </div>
          <div class="demo-client-list" id="demoClientList"></div>
        </div>
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Client Login</title>
    <link rel="stylesheet" href="../assets/styles.css?v=pdf-agent-banner-1" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-hero">
        <a class="brand" href="../" aria-label="Home">
          <span class="brand-plane"></span>
        </a>
        <div>
          <p class="dashboard-eyebrow">Client access</p>
          <h1>Sign in to view holiday quotes</h1>
          <p>Access your holiday quote dashboard and review agent offers in one secure place.</p>
        </div>
      </section>

      <section class="login-card">
        <form id="loginForm" class="login-form" data-dashboard-path="../dashboard/client/">
          <h2>Client Login</h2>
          <label class="field">
            <span>Email</span>
            <input name="email" type="email" autocomplete="email" />
          </label>
          <label class="field">
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password" />
          </label>
          <small data-login-error></small>
          <button class="submit-button" type="submit">View Dashboard</button>
        </form>
      </section>
    </main>

    <script src="../assets/app.js?v=pdf-agent-banner-1"></script>
  </body>
</html>
